<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 할일</title>
<style>
:root{--steel:#23456E;--amber:#D9822B;--bg:#F2F4F7;--card:#fff;--line:#DDE2E8;--tx:#1E2630;--sub:#6B7685;--red:#C9372C;--green:#2E8B57;--r:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Pretendard","Malgun Gothic","맑은 고딕",sans-serif}
header{background:#202833;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .logo{background:var(--amber);color:#202833;font-weight:800;border-radius:6px;width:28px;height:28px;display:grid;place-items:center}
header .dt{font-size:16px;font-weight:700}
header .end{font-size:12px;color:#C9D3DF}
header .sp{flex:1}
#dot{width:10px;height:10px;border-radius:50%;background:#888;display:inline-block}
#dot.ok{background:#3BC16B}#dot.ing{background:#F2C14E;animation:bl 1s infinite}#dot.err{background:#E5534B}
@keyframes bl{50%{opacity:.3}}
main{max-width:1100px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr 300px;gap:12px}
@media(max-width:760px){main{grid-template-columns:1fr;padding:8px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:14px;color:var(--steel);display:flex;align-items:center;gap:6px}
.panel h3 .n{background:var(--bg);color:var(--sub);border-radius:10px;padding:0 8px;font-size:12px;font-weight:600}
.add{display:flex;gap:6px;flex-wrap:wrap}
.add input[type=text]{flex:1 1 220px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.add select,.add input[type=date]{padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px}
button.pri{background:var(--steel);color:#fff;border-color:var(--steel);font-weight:700}
button.sm{padding:3px 8px;font-size:12px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:center}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--sub)}
.kpi .late b{color:var(--red)}.kpi .today b{color:var(--amber)}.kpi .done b{color:var(--green)}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #EEF1F4}
ul.tl li:last-child{border-bottom:0}
ul.tl li .t{flex:1;word-break:break-all;cursor:text}
ul.tl li.dn .t{text-decoration:line-through;color:var(--sub)}
ul.tl li input[type=checkbox]{width:18px;height:18px;flex:none}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:#E8EEF5;color:var(--steel);flex:none}
.tag.u{background:#FCE8E6;color:var(--red);font-weight:700}
.due{font-size:11px;color:var(--sub);flex:none}
.due.l{color:var(--red);font-weight:700}
.acts{display:flex;gap:3px;flex:none}
.empty{color:var(--sub);font-size:13px;padding:6px 4px}
.sec-late h3{color:var(--red)}.sec-today h3{color:var(--amber)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;resize:vertical}
.links a{display:block;padding:6px 8px;border-radius:6px;color:var(--steel);text-decoration:none;border:1px solid transparent}
.links a:hover{background:var(--bg);border-color:var(--line)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.row input,.row select{padding:6px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.small{font-size:12px;color:var(--sub)}
details summary{cursor:pointer;color:var(--sub);font-size:13px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:0;padding:10px;font-weight:700;color:var(--sub);background:#fff}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--steel);color:#fff}
.kpi small{display:block;font-size:11px;color:var(--sub)}
.bar{height:4px;background:#E6EAF0;border-radius:2px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.tag.w{background:#FFF1E0;color:#A35A10}table.qs{width:100%;border-collapse:collapse;font-size:13px}table.qs th{font-size:12px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;white-space:nowrap}table.qs td{padding:5px 6px;border-bottom:1px solid #EEF1F4;white-space:nowrap}table.qs .r{text-align:right}table.qs .sub{color:var(--sub)}table.qs tr.tot td{border-top:2px solid var(--line);font-weight:700;background:#F8FAFC}ul.tl li .note{font-size:12px;color:#7A5A12;background:#FFF8E6;border-radius:4px;padding:2px 6px;margin-top:3px;display:inline-block}.tag.a{background:#EEE9FB;color:#5B3FB0}.tag.m{background:#E9F6EE;color:var(--green)}
#scHint{font-size:12px;color:var(--sub);align-self:center}
</style>
</head>
<body>
<header>
  <div class="logo">T</div>
  <div><div class="dt" id="dt"></div><div class="end" id="end"></div></div>
  <div class="sp"></div>
  <span id="dot" title="동기화 상태"></span>
  <button class="sm" id="btnSync">새로고침</button>
</header>

<main>
<section>
  <div class="kpi">
    <div class="late"><b id="kLate">0</b><span>지연</span></div>
    <div class="today"><b id="kToday">0</b><span>오늘</span><small id="pToday"></small><div class="bar"><i id="bToday"></i></div></div>
    <div><b id="kWeek">0</b><span>이번 주</span><small id="pWeek"></small><div class="bar"><i id="bWeek"></i></div></div>
    <div><b id="kMonth">0</b><span>이번 달</span><small id="pMonth"></small><div class="bar"><i id="bMonth"></i></div></div>
  </div>

  <div class="tabs" id="tabs"><button data-v="d">일 · 오늘</button><button data-v="w">주 · 이번 주</button><button data-v="m">월 · 이번 달</button></div>

  <div class="panel">
    <div class="add">
      <input type="text" id="inTitle" placeholder="할일 입력 후 Enter">
      <select id="inSc"><option value="d">일</option><option value="w">주</option><option value="m">월</option></select>
      <select id="inCat"><option>품질</option><option>생산</option><option>문서</option><option>심사</option><option>기타</option></select>
      <select id="inPri"><option value="n">보통</option><option value="u">긴급</option></select>
      <input type="date" id="inDue">
      <span id="scHint"></span>
      <button class="pri" id="btnAdd">추가</button>
    </div>
  </div>

  <div id="lists"></div>
</section>

<aside>
  <div class="panel"><h3>메모</h3><textarea id="memo" placeholder="자유 메모 (자동 저장)"></textarea></div>

  <div class="panel">
    <h3>반복업무</h3>
    <ul class="tl" id="lRec"></ul>
    <details><summary>＋ 반복업무 추가</summary>
      <div class="row"><input id="rTitle" placeholder="업무명" style="flex:1"></div>
      <div class="row">
        <select id="rType"><option value="d">매일(근무일)</option><option value="w">매주</option><option value="m">매월</option></select>
        <select id="rWd"><option value="1">월</option><option value="2">화</option><option value="3">수</option><option value="4">목</option><option value="5">금</option></select>
        <input id="rMd" type="number" min="1" max="31" value="1" style="width:60px"><span class="small" id="rMdL">일</span>
        <select id="rCat"><option>품질</option><option>생산</option><option>문서</option><option>심사</option><option>기타</option></select>
        <button class="sm pri" id="btnRec">등록</button>
      </div>
      <div class="small">매월 일자가 말일보다 크면 말일에, 주말·공휴일이면 직전 근무일에 생성 / 매일 업무는 공휴일 제외</div>
    </details>
  </div>

  <div class="panel links">
    <h3>바로가기</h3>
    <div id="lLinks"></div>
    <details><summary>＋ 바로가기 추가</summary>
      <div class="row"><input id="kName" placeholder="이름" style="flex:1"></div>
      <div class="row"><input id="kUrl" placeholder="https://..." style="flex:1"><button class="sm pri" id="btnLink">추가</button></div>
    </details>
  </div>
</aside>
</main>

<script>
(function(){
const SB_URL='https://omngtyewdaqpphnzeate.supabase.co';
const SB_KEY='sb_publishable_9j2YkkL-7ul1TrhH-NjVdQ_vWDG2-1D';
const KV='tj_today_v1', LS='tj_today_v1';
const $=id=>document.getElementById(id);
const WD=['일','월','화','수','목','금','토'];

function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function now(){return new Date()}
function today(){return ymd(now())}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const DEF_LINKS=[];
let S={tasks:{},recs:{},links:{},del:{},hide:{},amark:{},memo:'',memoUa:0,seedV:0};
function load(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v)S=Object.assign(S,v);}catch(e){}S.hide=S.hide||{};S.del=S.del||{};S.amark=S.amark||{};}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ---------- 병합(기기 간) ---------- */
function mergeMap(a,b,del){
  const out={};
  for(const src of [a||{},b||{}])for(const id in src){
    const x=src[id];if(!out[id]||(x.ua||0)>(out[id].ua||0))out[id]=x;}
  for(const id in out)if(del[id]&&del[id]>=(out[id].ua||0))delete out[id];
  return out;
}
function merge(r){
  if(!r)return;
  const del=Object.assign({},S.del);
  for(const k in (r.del||{}))if(!del[k]||r.del[k]>del[k])del[k]=r.del[k];
  // 삭제기록 60일 지나면 정리
  const lim=Date.now()-60*864e5;for(const k in del)if(del[k]<lim&&!/^s[rl]_/.test(k))delete del[k];
  S.tasks=mergeMap(S.tasks,r.tasks,del);
  S.recs=mergeMap(S.recs,r.recs,del);
  S.links=mergeMap(S.links,r.links,del);
  S.del=del;
  const hd=Object.assign({},S.hide||{});for(const k in (r.hide||{}))if(!hd[k]||r.hide[k]>hd[k])hd[k]=r.hide[k];
  for(const k in hd)if(hd[k]<lim)delete hd[k];S.hide=hd;
  S.seedV=Math.max(S.seedV||0,r.seedV||0);
  S.amark=mergeMap(S.amark,r.amark,{});
  if((r.memoUa||0)>(S.memoUa||0)){S.memo=r.memo||'';S.memoUa=r.memoUa;}
}

/* ---------- 서버 동기화 ---------- */
function dot(c){$('dot').className=c}
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
async function pull(){
  const r=await fetch(SB_URL+'/rest/v1/kv_store?select=value&key=eq.'+KV,{headers:H});
  if(!r.ok)throw new Error('pull '+r.status);
  const j=await r.json();return j[0]?j[0].value:null;
}
async function push(){
  const r=await fetch(SB_URL+'/rest/v1/kv_store?on_conflict=key',{method:'POST',
    headers:Object.assign({Prefer:'resolution=merge-duplicates,return=minimal'},H),
    body:JSON.stringify([{key:KV,value:S,updated_at:new Date().toISOString()}])});
  if(!r.ok)throw new Error('push '+r.status);
}
let busy=false,again=false;
async function sync(){
  if(busy){again=true;return}
  busy=true;dot('ing');
  try{merge(await pull());seed();genRecur();saveLocal();render();await push();dot('ok');}
  catch(e){dot('err');console.warn(e)}
  busy=false;if(again){again=false;sync()}
}
let tm=null;
function changed(){saveLocal();render();clearTimeout(tm);tm=setTimeout(sync,800)}

/* ---------- 공휴일 (법정공휴일·대체공휴일·선거일) ---------- */
const HOL=new Set(['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-02','2026-05-01','2026-05-05','2026-05-25','2026-06-03','2026-07-17','2026-08-17','2026-09-24','2026-09-25','2026-10-05','2026-10-09','2026-12-25',
  '2027-01-01','2027-02-08','2027-02-09','2027-03-01','2027-05-03','2027-05-05','2027-05-13','2027-07-19','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-04','2027-10-11','2027-12-27']);
function isOff(s){const w=new Date(s+'T00:00:00').getDay();return w===0||w===6||HOL.has(s)}
function prevWork(s){let d=s,i=0;while(isOff(d)&&i++<10)d=addDays(d,-1);return d}
/* ---------- 반복업무 생성 ---------- */
function recDue(rc,day){
  const d=new Date(day+'T00:00:00'),w=d.getDay();
  if(rc.type==='d')return !isOff(day);
  if(rc.type==='w')return w===+rc.wd;
  if(rc.type==='m'){
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    return prevWork(ymd(new Date(d.getFullYear(),d.getMonth(),Math.min(+rc.md,last))))===day;
  }
  return false;
}
// 반복업무: 일=오늘, 주=이번 주 해당 요일, 월=이번 달 해당 일자로 기간 시작부터 미리 생성
// (등록일 이전 날짜분은 만들지 않음 — 처음 등록했을 때 지난 일자가 지연으로 쌓이지 않도록)
function recTarget(rc,t){
  if(rc.type==='d')return recDue(rc,t)?t:null;
  if(rc.type==='w'){const d=addDays(weekStart(t),(+rc.wd||1)-1),p=prevWork(d);return p>=weekStart(t)?p:null}
  if(rc.type==='m'){let d=monthStart(t);const e=monthEnd(t);while(d<=e){if(recDue(rc,d))return d;d=addDays(d,1)}return null}
  return null;
}
function genRecur(){
  const t=today();let n=0;
  for(const id in S.recs){const rc=S.recs[id];
    const day=recTarget(rc,t);if(!day)continue;
    if(day<(rc.since||'0000'))continue;
    const tid='r_'+id+'_'+day;            // 기기 간 중복 방지용 고정 ID
    if(S.tasks[tid]||S.del[tid])continue;
    S.tasks[tid]={id:tid,title:rc.title,cat:rc.cat,pri:'n',due:day,st:'o',rec:id,url:rc.url||'',ca:Date.now(),ua:Date.now()};n++;
  }
  return n;
}

/* ---------- 기간 계산 ---------- */
function dObj(s){return new Date(s+'T00:00:00')}
function weekStart(s){const d=dObj(s),w=d.getDay();d.setDate(d.getDate()-(w===0?6:w-1));return ymd(d)}   // 월요일
function weekEnd(s){return addDays(weekStart(s),6)}
function weekFri(s){return addDays(weekStart(s),4)}
function monthEnd(s){const d=dObj(s);return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))}
function monthStart(s){return s.slice(0,8)+'01'}
function normDue(sc,s){return sc==='w'?weekFri(s):sc==='m'?monthEnd(s):s}
function scOf(x){return x.sc||'d'}
function md(s){return (+s.slice(5,7))+'/'+(+s.slice(8,10))}

/* ---------- 포털 기본 업무 (최초 1회 등록, 삭제하면 다시 안 생김) ---------- */
const PB='https://knagbyeongju-123.github.io/smtec_main2/', PK='https://kimsanggi85-del.github.io/', PO='https://0528ohm-ui.github.io/TaeJin_ESG/';
const URL_={calib:PK+'calibration/index.html',pm:PK+'p_time-check/PM_checksheet.html',mold:PK+'mold_periodic_inspection/',patrol:PK+'patrol_5s/',
  train:PK+'-Training-/',eff:PK+'quality_effectiveness/',setting:PK+'press_setting/',m4:PK+'4M_initial_flow_alarm-/',skill:PK+'skill_eval/',repair:PB+'mold_repair.html',kpi:PK+'ESG_KIP-Team-process/',qs:PB+'defect_monthly.html'};
const SEED_RECS=[
  ['sr_d1','d',0,0,'품질','일상점검 종합현황 확인',PB+'check_dashboard.html'],
  ['sr_d2','d',0,0,'품질','외관불량 등록·이력 확인',PB+'defect.html'],
  ['sr_d3','d',0,0,'생산','생산마감(실제양품) 입력 확인',PB+'mes_work.html'],
  ['sr_d4','d',0,0,'생산','전일 생산일보 확인',PK+'Daily-Production-Report/'],
  ['sr_w1','w',1,0,'품질','치수추이 공차 80% 임박 품번 확인',PB+'QC_dim.html'],
  ['sr_w2','w',3,0,'품질','공정점검(라인 순회)',PB+'line_patrol.html'],
  ['sr_w3','w',4,0,'품질','4M 변경·초기유동 현황 확인',PK+'4M_initial_flow_alarm-/'],
  ['sr_w4','w',5,0,'품질','측정기 종합현황 확인',PO+'qc_measure_00_dashboard.html'],
  ['sr_m1','m',0,5,'문서','전월 KPI 실적 입력',PK+'ESG_KIP-Team-process/'],
  ['sr_m2','m',0,10,'기타','안전점검',PB+'safety_check.html'],
  ['sr_m3','m',0,20,'품질','현장조도 측정',PO+'illuminance_report.html'],
  ['sr_m4','m',0,31,'문서','일상점검 월말결재',PB+'approval_report.html']
];
const SEED_LINKS=[
  
  ['sl_01','ESG 통합 포털',PB],['sl_02','KPI 관리',PK+'ESG_KIP-Team-process/'],['sl_03','품질시스템(IATF)',PK+'TJ-IATF16949_Original/'],
  ['sl_04','일상점검 종합현황',PB+'check_dashboard.html'],['sl_05','외관불량/보고서',PB+'defect.html'],['sl_06','특별불량보고서',PK+'Special_Defect/special_defect_report.html'],
  ['sl_07','유출불량·유효성평가',URL_.eff],['sl_08','검교정관리',URL_.calib],['sl_09','설비정기점검(PM)',URL_.pm],
  ['sl_10','금형정기점검',URL_.mold],['sl_11','금형세팅표준',URL_.setting],['sl_12','3정5S',URL_.patrol],
  ['sl_13','교육관리',URL_.train],['sl_14','작업자 숙련도 평가',PK+'skill_eval/'],['sl_15','생산일보',PK+'Daily-Production-Report/'],['sl_16','재고현황',PK+'stock_ledger/'],['sl_17','4M 변경·초기유동',URL_.m4],['sl_18','금형 수리관리',URL_.repair],['sl_19','월 품질현황 보고서',URL_.qs]
];
function seed(){
  const v=S.seedV||0;if(v>=3)return false;
  const addL=([id,name,url],i)=>{if(!S.links[id]&&!S.del[id])S.links[id]={id,name,url,ca:i+1,ua:1}};
  if(v<1){
    SEED_RECS.filter(r=>r[0]!=='sr_m1').forEach(([id,type,wd,md,cat,title,url],i)=>{if(!S.recs[id]&&!S.del[id])S.recs[id]={id,title,type,wd,md,cat,url,since:today(),ca:i+1,ua:1}});
    SEED_LINKS.forEach(addL);

}

    const late=ca.filter(c=>c.due_date&&c.due_date<t);
    if(late.length)out.push(A('kca_late',{title:'KPI 시정조치 기한경과 '+late.length+'건 — '+names([...new Set(late.map(c=>nm(c.kpi_id)))],3),sc:'d',due:late.map(c=>c.due_date).sort()[0],url:URL_.kpi,cat:'문서',pri:'u'}));
    const g={};ca.forEach(c=>{if(!c.due_date||c.due_date<t||c.due_date>addDays(t,30))return;(g[c.due_date]=g[c.due_date]||[]).push(c)});
    for(const d in g)out.push(A('kca_'+d,{title:'KPI 시정조치 기한 '+g[d].length+'건 — '+names([...new Set(g[d].map(c=>nm(c.kpi_id)))],3),sc:'d',due:d,url:URL_.kpi,cat:'문서'}));
    // 전월 미입력 = 직전 3개월 중 입력 이력이 있는 KPI 가운데 전월 실적이 없는 것 (분기·연 단위 KPI 오탐 방지)
    const ix=(yy,mm)=>yy*12+mm-1,L=ix(y,m)-1,lm=L%12+1;
    const rc=(K.rec||[]).map(r=>({id:r.kpi_id,i:ix(+r.year,+r.month)}));
    const has=new Set(rc.filter(r=>r.i===L).map(r=>r.id)),used=new Set(rc.filter(r=>r.i<L&&r.i>=L-3).map(r=>r.id));
    const act=K.master.filter(x=>x.is_active!==false&&(used.has(x.id)||has.has(x.id)));
    const miss=act.filter(x=>!has.has(x.id));
    if(act.length)out.push(A('krec_'+ym,{title:lm+'월 KPI 실적 입력 — '+(miss.length?'미입력 '+miss.length+'/'+act.length+'개 ('+names(miss.map(x=>x.kpi_name),3)+')':act.length+'개 완료'),sc:'d',due:ym+'-05',url:URL_.kpi,cat:'문서',st:miss.length?'o':'d',dd:miss.length?null:t}));});
  // 14) 월 품질현황 — 전월 마감(누적 반영) 여부
  safe(()=>{const Q=D.__qs;if(!Q||!Q.cells.length)return;
    const L=(y*12+m-1)-1,lmk=Math.floor(L/12)+'-'+pad(L%12+1),pmk=Math.floor((L-1)/12)+'-'+pad((L-1)%12+1);
    const vPrev=[...new Set(Q.cells.filter(c=>c.mk===pmk).map(c=>c.vn))],vLast=new Set(Q.cells.filter(c=>c.mk===lmk).map(c=>c.vn));
    const miss=vPrev.filter(v=>!vLast.has(v));const lm=L%12+1;
    out.push(A('qs_'+lmk,{title:lm+'월 품질현황 월마감 — '+(miss.length?'미마감 '+miss.length+'/'+vPrev.length+'개 거래처 ('+names(miss,3)+')':'완료 ('+vLast.size+'개 거래처)'),sc:'d',due:ym+'-05',url:URL_.qs,st:miss.length?'o':'d',dd:miss.length?null:t}));});
  return out;
}

  delLink(id){if(confirm('바로가기를 삭제할까요?'))delItem('links',id)},
  hideA(id){S.hide[id]=Date.now();changed()},

  note(id){const auto=id.startsWith('a_');const cur=auto?((S.amark[id]||{}).note||''):((S.tasks[id]||{}).note||'');

    if(auto){S.amark[id]=Object.assign({st:'o'},S.amark[id],{note:v.trim(),ua:Date.now()});changed()}else upd(id,{note:v.trim()})},
  unhide(){S.hide={};changed()},
  copyRep(){

    let txt=head+'\n';
    const rt=x=>!(x.rec&&S.recs[x.rec]&&S.recs[x.rec].type==='d');   // 매일 반복업무는 보고서에서 제외
    SECS.forEach(([ti,a0])=>{const arr=a0.filter(rt);if(!arr.length||/^보류/.test(ti))return;

      arr.forEach(x=>{const sc=scOf(x);const due=sc==='w'?md(weekStart(x.due))+'~'+md(weekEnd(x.due)):sc==='m'?(+x.due.slice(5,7))+'월':md(x.due);

    if(VIEW==='m'&&QSS){const Q=QSS,f=n=>n===null?'-':Number(n).toLocaleString();

      Q.rows.forEach(r=>{txt+=' · '+r.vn+': '+f(r.ppm)+' PPM (전월 '+f(r.prev)+', 목표 '+f(r.target)+')'+(r.ppm!==null&&r.ppm>r.target?' ▶ 목표 초과':'')+'\n'});
      txt+=' · 계: '+f(Q.tot.ppm)+' PPM (전월 '+f(Q.tot.prev)+')\n';}
    const done=()=>{const b=$('btnCopy');if(b){b.textContent='복사됨 ✓';setTimeout(()=>{try{b.textContent='📋 다시 복사'}catch(_){}},2000)}};
    const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();done()};
    window.__lastRep=txt;
    try{navigator.clipboard.writeText(txt).then(done,fb)}catch(_){fb()}
  }
};

  const ls=Object.values(S.links).sort((a,b)=>(a.ca||0)-(b.ca||0));
  $('lLinks').innerHTML=ls.length?ls.map(k=>'<div style="display:flex;align-items:center"><a href="'+esc(k.url)+'" target="_blank" style="flex:1">↗ '+esc(k.name)+'</a><button class="sm" onclick="TD.delLink(\''+k.id+'\')">✕</button></div>').join(''):'<div class="empty">바로가기 없음</div>';
  if(document.activeElement!==$('memo'))$('memo').value=S.memo||'';

$('inSc').value=VIEW;
$('inSc').onchange=hint;$('inDue').addEventListener('change',hint);hint();
$('tabs').onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;if(!v)return;VIEW=v;try{localStorage.setItem('tj_today_view',v)}catch(_){}$('inSc').value=v;hint();render()};
$('inTitle').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)addTask()});
$('btnSync').onclick=()=>{sync();refreshAuto()};
let mt=null;
$('memo').addEventListener('input',()=>{S.memo=$('memo').value;S.memoUa=Date.now();saveLocal();clearTimeout(mt);mt=setTimeout(sync,1500)});
$('memo').addEventListener('blur',render);
function recUi(){const t=$('rType').value;$('rWd').style.display=t==='w'?'':'none';$('rMd').style.display=$('rMdL').style.display=t==='m'?'':'none'}
$('rType').onchange=recUi;recUi();
$('btnRec').onclick=()=>{
  const t=$('rTitle').value.trim();if(!t)return alert('업무명을 입력하세요');
  const id=uid();
  S.recs[id]={id,title:t,type:$('rType').value,wd:+$('rWd').value,md:Math.max(1,Math.min(31,+$('rMd').value||1)),cat:$('rCat').value,since:today(),ca:Date.now(),ua:Date.now()};
  $('rTitle').value='';genRecur();changed();
};
$('btnLink').onclick=()=>{
  const n=$('kName').value.trim(),u=$('kUrl').value.trim();if(!n||!u)return alert('이름과 주소를 입력하세요');
  const id=uid();S.links[id]={id,name:n,url:/^https?:\/\//.test(u)?u:'https://'+u,ca:Date.now(),ua:Date.now()};
  $('kName').value=$('kUrl').value='';changed();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();if(!autoAt||Date.now()-autoAt>300000)refreshAuto()}});
setInterval(refreshAuto,600000);
window.addEventListener('online',sync);
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();$('inDue').value=lastDay;hint();genRecur();changed()}else render()},60000);

load();genRecur();saveLocal();render();sync();refreshAuto();
})();
</script>
</body>
</html>
